<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Cindy Mayorista — Preventa</title>
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2232%22%20fill%3D%22%23e84e1b%22%2F%3E%3Ctext%20x%3D%2233%22%20y%3D%2245%22%20font-family%3D%22Georgia%2C%20'Times%20New%20Roman'%2C%20serif%22%20font-size%3D%2240%22%20font-weight%3D%22700%22%20fill%3D%22white%22%20text-anchor%3D%22middle%22%3EC%3C%2Ftext%3E%3C%2Fsvg%3E" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Lora:wght@600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/catalogo.css" />
        <style>
            /* ── Botón de escaneo en barra de búsqueda ── */
            .search { display: flex; align-items: center; gap: 6px; padding: 6px 20px 12px; }
            .search input { flex: 1; }
            .scan-btn {
                flex-shrink: 0;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--ink);
                font-size: 1.15em;
                padding: 6px 10px;
                cursor: pointer;
                line-height: 1;
            }
            .scan-btn:active { background: var(--pale); }
            /* ── Modal escáner ── */
            .scanner-modal-bg {
                display: none;
                position: fixed; inset: 0;
                background: rgba(0,0,0,0.7);
                z-index: 9999;
                align-items: center;
                justify-content: center;
                padding: 16px;
            }
            .scanner-modal-bg.open { display: flex; }
            .scanner-modal {
                background: #fff;
                border-radius: 12px;
                overflow: hidden;
                width: 100%;
                max-width: 400px;
            }
            .scanner-modal-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                background: var(--ink);
                color: #fff;
                font-weight: 700;
                font-size: 0.95em;
            }
            .scanner-modal-head button {
                background: none;
                border: none;
                color: #fff;
                font-size: 1.2em;
                cursor: pointer;
                line-height: 1;
                padding: 0 2px;
            }
            @keyframes focusPulse {
                0%   { transform: scale(1.4); opacity: 1; }
                60%  { transform: scale(1);   opacity: 1; }
                100% { transform: scale(1);   opacity: 0; }
            }
            .focus-indicator {
                position: fixed;
                width: 56px; height: 56px;
                border: 2px solid #fff;
                border-radius: 4px;
                pointer-events: none;
                z-index: 99999;
                transform-origin: center;
                animation: focusPulse 0.6s ease-out forwards;
                box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
            }
        </style>
    </head>
    <body>
        <header>
            <div class="preventa-strip">
                <span class="dot"></span>Preventa — Reservá antes de que llegue
            </div>
            <div class="h-top">
                <div class="brand">
                    <img
                        src="assets/img/cindy-logo.png"
                        alt="Cindy Mayorista"
                        style="height: 34px"
                    />
                </div>
                <div class="h-right">
                    <div class="h-right-top">
                        <a class="admin-btn" href="admin/"
                            ><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> <span class="admin-txt">Admin</span></a
                        >
                        <div class="view-btns">
                            <button
                                class="view-btn on"
                                id="btnGrid"
                                onclick="setView('grid')"
                                title="Vista grilla"
                            >
                                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/></svg>
                            </button>
                            <button
                                class="view-btn"
                                id="btnList"
                                onclick="setView('list')"
                                title="Vista lista"
                            >
                                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="h-right-bottom">
                        <button class="cart-btn" onclick="openCart()">
                            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg> Mi pedido
                            <div class="cart-n" id="cartN">0</div>
                        </button>
                    </div>
                </div>
            </div>
            <div class="search">
                <input
                    type="text"
                    id="srch"
                    placeholder="Buscar por nombre, código o barras..."
                    oninput="doSearch()"
                    onkeydown="doSearchEnter(event)"
                />
                <button
                    class="scan-btn"
                    onclick="openBarcodeScanner(function(code){document.getElementById('srch').value=code;doSearchEnter({key:'Enter'});})"
                    title="Escanear código de barras"
                ><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
            </div>
        </header>

        <div class="prev-selector-outer" id="preventaSelectorOuter" style="display:none">
            <div class="prev-selector" id="preventaSelector"></div>
            <button type="button" class="prev-selector-fade" aria-label="Ver más preventas" onclick="scrollPrevSelector()"></button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div
            class="cat-dropdown-wrap"
            id="catDropdownWrap"
            style="display: none"
        >
            <button
                class="cat-dropdown-btn"
                id="catDropdownBtn"
                onclick="toggleCatDropdown()"
            >
                <span id="catDropdownLabel">TODOS</span> <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="cat-dropdown-menu" id="catDropdownMenu"></div>
        </div>
        <div class="body" id="prods">
            <div class="loading">
                <div class="spin"></div>
                Cargando catálogo...
            </div>
        </div>

        <div class="overlay" id="overlay" onclick="bgClose(event)">
            <div class="panel">
                <div class="p-head">
                    <h2><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg> Mi pedido</h2>
                    <button class="cls" onclick="closeCart()"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                </div>

                <!-- ZONA 1: productos (scroll independiente) -->
                <div class="p-products">
                    <!-- Toggle (solo mobile) -->
                    <button
                        class="cart-section-toggle"
                        id="toggleItemsBtn"
                        onclick="toggleCartSection('items')"
                    >
                        <span id="toggleItemsLabel"
                            ><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg> Ver productos del pedido</span
                        >
                    </button>
                    <div
                        class="cart-items-section mobile-collapsed"
                        id="cartItemsSection"
                    >
                        <div id="pitems"></div>
                    </div>
                </div>

                <!-- ZONA 2: total + formulario (scroll independiente) -->
                <div class="p-form-area">
                    <div id="cartToast" class="cart-toast"></div>
                    <div class="total-row">
                        <span class="total-lbl">Total mayorista:</span
                        ><span class="total-val" id="ptotal">$ 0</span>
                    </div>
                    <button class="continue-btn" onclick="closeCart()">
                        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Continuar comprando
                    </button>

                    <!-- Toggle formulario (solo mobile) -->
                    <button
                        class="cart-section-toggle"
                        id="toggleFormBtn"
                        onclick="toggleCartSection('form')"
                        style="margin-top: 4px"
                    >
                        <span id="toggleFormLabel"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg> Datos del pedido</span>
                    </button>
                    <div class="cart-section-body" id="cartFormSection">
                        <!-- TELÉFONO -->
                        <div class="field-group" style="margin-top: 8px">
                            <label class="field-lbl"
                                >Teléfono <span class="req">*</span></label
                            >
                            <div class="tel-row">
                                <input
                                    id="cCaract"
                                    type="tel"
                                    placeholder="353"
                                    maxlength="4"
                                    oninput="onTelChange()"
                                />
                                <input
                                    id="cNum"
                                    type="tel"
                                    placeholder="4140385"
                                    maxlength="8"
                                    oninput="onTelChange()"
                                />
                            </div>
                            <div class="field-hint-sm">
                                Característica sin 0 + número sin 15
                            </div>
                        </div>
                        <!-- FORMULARIO CLIENTE -->
                        <div id="clienteForm" style="display: none">
                            <div class="form-section-title">
                                Datos del pedido
                            </div>
                            <div class="field-group">
                                <label class="field-lbl"
                                    >Nombre / Razón Social
                                    <span class="req">*</span></label
                                >
                                <input
                                    id="cNombre"
                                    type="text"
                                    placeholder="Nombre o razón social"
                                />
                            </div>
                            <div class="field-row">
                                <div class="field-group">
                                    <label class="field-lbl">CUIT / DNI</label>
                                    <input
                                        id="cCuitDni"
                                        type="text"
                                        placeholder="20-12345678-9"
                                    />
                                </div>
                                <div class="field-group">
                                    <label class="field-lbl">Email</label>
                                    <input
                                        id="cEmail"
                                        type="email"
                                        placeholder="mail@ejemplo.com"
                                    />
                                </div>
                            </div>
                            <div class="form-section-title">Datos de envío</div>
                            <div class="field-group">
                                <label class="field-lbl">Domicilio</label>
                                <input
                                    id="cDomicilio"
                                    type="text"
                                    placeholder="Calle y número"
                                />
                            </div>
                            <div class="field-row">
                                <div class="field-group">
                                    <label class="field-lbl">Localidad</label>
                                    <input
                                        id="cLocalidad"
                                        type="text"
                                        placeholder="Ciudad"
                                    />
                                </div>
                                <div class="field-group">
                                    <label class="field-lbl">CP</label>
                                    <input
                                        id="cCP"
                                        type="text"
                                        placeholder="5000"
                                    />
                                </div>
                            </div>
                            <div class="field-group">
                                <label class="field-lbl">Provincia</label>
                                <input
                                    id="cProvincia"
                                    type="text"
                                    placeholder="Córdoba"
                                />
                            </div>
                            <div class="field-group">
                                <label class="field-lbl">Transporte</label>
                                <select
                                    id="cTransporte"
                                    onchange="onTransporteChange()"
                                >
                                    <option value="">— Seleccioná —</option>
                                </select>
                            </div>
                            <div
                                class="field-group"
                                id="cTransporteOtroWrap"
                                style="display: none"
                            >
                                <label class="field-lbl"
                                    >Especificá el transporte</label
                                >
                                <input
                                    id="cTransporteOtro"
                                    type="text"
                                    placeholder="Nombre del transporte"
                                />
                            </div>
                            <div class="field-group">
                                <label class="field-lbl"
                                    >Notas / Aclaraciones</label
                                >
                                <textarea
                                    id="cNotas"
                                    placeholder="Indicaciones especiales..."
                                    rows="2"
                                ></textarea>
                            </div>
                        </div>
                    </div>
                    <!-- end cartFormSection -->
                    <button class="wa" onclick="sendWA()">
                        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg> Confirmar y enviar pedido
                    </button>
                </div>
                <!-- end p-form-area -->
            </div>
        </div>

        <!-- BARCODE SCANNER MODAL -->
        <div class="scanner-modal-bg" id="scannerModal" onclick="if(event.target===this)closeBarcodeScanner()">
            <div class="scanner-modal">
                <div class="scanner-modal-head">
                    <span><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> Escanear código de barras</span>
                    <button onclick="closeBarcodeScanner()"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                </div>
                <div style="padding:16px 16px 20px">
                    <div id="scannerReader" style="width:100%"></div>
                    <div id="scannerStatus" style="text-align:center;margin-top:10px;font-size:0.85em;color:#888">Apuntá la cámara al código de barras</div>
                </div>
            </div>
        </div>

        <!-- MODAL "ELEGIR COLORES" (mobile — en desktop se usa el panel dentro de cada card, ver color-panel en catalogo.js) -->
        <div class="cm-bg" id="cmBg" onclick="if(event.target===this) closeColorModal()">
            <div class="cm-sheet" id="cmSheet">
                <div class="cm-handle"></div>
                <div class="cm-photo-wrap">
                    <img class="cm-photo" id="cmImg" alt="" onclick="openLightbox(this)" />
                    <button class="cm-close" onclick="closeColorModal()" aria-label="Cerrar"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                </div>
                <div class="cm-head">
                    <div class="cm-head-info">
                        <div class="cm-name" id="cmName"></div>
                        <div class="cm-price" id="cmPrice"></div>
                    </div>
                </div>
                <div class="cm-rows" id="cmRows"></div>
                <div class="cm-foot">
                    <button class="cm-remove" id="cmRemoveBtn" onclick="removeColorProduct(colorModalCode, closeColorModal)">Quitar del pedido</button>
                    <div class="cm-foot-main">
                        <span class="cm-total" id="cmTotal">Elegí una cantidad</span>
                        <button class="cm-confirm" id="cmConfirmBtn" onclick="confirmColorModal()">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- LIGHTBOX de foto de producto — un solo elemento compartido por las 3
             vistas (grilla, tabla y modal de colores), ver openLightbox() en
             catalogo.js. La animación de "crecer" mueve/agranda esta misma
             etiqueta <img> desde el rect exacto de la miniatura clickeada. -->
        <div class="lightbox-bg" id="lightboxBg" onclick="if(event.target===this) closeLightbox()">
            <button class="lightbox-close" onclick="closeLightbox()" aria-label="Cerrar"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            <img class="lightbox-img" id="lightboxImg" alt="" />
        </div>

        <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
        <script src="assets/js/icons.js"></script>
        <script src="assets/js/catalogo.js"></script>
    </body>
</html>
